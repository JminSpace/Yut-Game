<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap">
<title>증강 윷놀이</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#1d2a43;--panel:#26375a;--panel2:#2f4268;--line:#43587f;--fg:#f0f3f9;--mute:#aab8d0;--gold:#e2bd72;--gold2:#b08d45;--gold3:#f7e6b8;--a:#e2505e;--b:#4f97ea;--err:#ff9a9a;--f1:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;--f2:"Noto Serif KR","Batang","AppleMyungjo",serif;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(120% 70% at 50% -10%,#30456f 0%,rgba(29,42,67,0) 62%);background-repeat:no-repeat;color:var(--fg);font:400 15px/1.55 var(--f1)}
main{max-width:460px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gm{max-width:1200px}
h1{margin:4px 0 0;font:700 28px/1.25 var(--f2);letter-spacing:.03em;color:var(--gold3);text-wrap:balance}
.sub{margin:3px 0 12px;color:var(--mute);font-size:13px}
.t{font-size:12.5px;color:var(--mute)}
.pn{margin-top:14px;background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:14px 16px;box-shadow:0 12px 26px rgba(8,14,28,.4),inset 0 1px 0 rgba(255,255,255,.08)}
button{font:700 15px/1.2 var(--f1);letter-spacing:.02em;padding:11px 20px;border:0;border-radius:12px;color:#1c1608;background:linear-gradient(180deg,var(--gold3),var(--gold) 55%,var(--gold2));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #7a5e24,0 8px 14px rgba(8,14,28,.4);cursor:pointer;transition:transform .1s,box-shadow .1s}
button:hover:not(:disabled){filter:brightness(1.07)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 #7a5e24,0 3px 6px rgba(8,14,28,.4)}
button:disabled{opacity:.4;cursor:default}
button.o{color:var(--fg);background:linear-gradient(180deg,#3d5481,#2d4168);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #16203a,0 8px 14px rgba(8,14,28,.35)}
button.o:active:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 #16203a,0 3px 6px rgba(8,14,28,.35)}
button.sm{padding:8px 14px;font-size:13px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold3);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 14px;margin-bottom:6px}
.hd h1{margin:0;font-size:24px}.mn{display:flex;gap:8px;flex-wrap:wrap}
.tn{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:99px;padding:6px 16px;order:3;flex:1 0 100%;justify-content:center;flex-wrap:wrap}
.td{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.35)}.td.r,.pcs.r{background:radial-gradient(circle at 35% 30%,#ffa3ab,#e2505e 45%,#64111f)}.td.b,.pcs.b{background:radial-gradient(circle at 35% 30%,#a8d6ff,#4f97ea 45%,#12376e)}
.gr{display:grid;gap:14px;align-items:start}.cc{order:1}.cr{order:2}.cl{order:3}
.cl .pn:first-child,.cr .pn:first-child{margin-top:0}
.pl.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(226,189,114,.55),inset 0 0 22px rgba(226,189,114,.14),0 12px 26px rgba(8,14,28,.4)}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.who b{font:700 17px var(--f2);color:var(--gold3)}.cnt{font:700 15px var(--f1);color:var(--fg)}
.orbs{display:flex;gap:10px;margin:12px 0 6px}
.pcs{display:inline-block;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 4px rgba(0,0,0,.35),0 3px 5px rgba(8,14,28,.45);text-align:center;font:700 15px/30px var(--f1);color:#fff}
.pcs.bd{outline:3px solid var(--gold);outline-offset:2px}.pcs.dn{opacity:.4;filter:saturate(.5)}
.meta{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.augs{display:grid;gap:7px}
.ag2{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;line-height:1.4;color:var(--mute)}
.ag2 b{display:block;font:700 13.5px var(--f1);color:var(--fg)}
.ag2.희귀{border-color:rgba(100,170,240,.8)}.ag2.전설{border-color:rgba(226,189,114,.95);box-shadow:0 0 12px rgba(226,189,114,.22)}
.ag2.em{text-align:center;border-style:dashed;background:none;padding:8px}
.cc{--bw:max(320px,min(100%,calc(100vh - 330px)))}
#bd{width:100%;max-width:var(--bw);margin:0 auto;box-sizing:border-box;padding:8px;border-radius:26px;background:linear-gradient(150deg,#4c6189,#243452);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 34px rgba(8,14,28,.5),0 2px 0 #131c30}
svg{display:block;width:100%;height:auto}
.tk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.g1{stroke:#111a2c;stroke-width:21}.g2{stroke:#1d2a44;stroke-width:15}.gl{stroke:var(--gold);stroke-width:1.2;stroke-opacity:.5;stroke-dasharray:1 8}
.lb{fill:var(--mute);font:11px var(--f1);letter-spacing:.06em}
.orb{stroke:rgba(0,0,0,.4);stroke-width:1}
.mv{cursor:pointer;stroke:var(--gold3);stroke-width:3;animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{stroke-width:6;stroke-opacity:.35}}
.hp{animation:hop .3s ease-out}@keyframes hop{40%{transform:translateY(-9px)}}
.ct{fill:#1c1608;font:700 11px var(--f1);pointer-events:none}
.mat{position:relative;height:100px;border-radius:14px;background:radial-gradient(120% 130% at 50% 0%,#4b7d6d,#2c5246);box-shadow:inset 0 4px 12px rgba(5,12,20,.55),inset 0 0 0 1px rgba(255,255,255,.07);perspective:560px;overflow:hidden}
.stk{position:absolute;bottom:14px;width:15px;height:70px;margin-left:-7px;transform-style:preserve-3d;transform:translate(var(--dx,0px),0) rotateX(var(--rx,0deg)) rotateZ(var(--rz,0deg));animation:toss var(--du,1000ms) linear var(--dl,0ms) both}
.stk i{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.stk .fr{background:linear-gradient(90deg,#cbb988,#f8eed0 45%,#bba777);box-shadow:inset 0 0 0 1px rgba(90,70,30,.35),0 4px 6px rgba(0,0,0,.3)}
.stk .bk2{background:linear-gradient(90deg,#412b17,#946a3a 40%,#38251a);transform:rotateX(180deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.stk u{position:absolute;left:50%;top:11px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#d9414f;text-decoration:none}
.stk.rs{animation:none}
@keyframes toss{
0%{transform:translate(calc(var(--dx)*-1.6),0) rotateX(0deg) rotateZ(0deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
42%{transform:translate(calc(var(--dx)*.4),-82px) rotateX(calc(var(--rx)*.55)) rotateZ(calc(var(--rz)*.6));animation-timing-function:cubic-bezier(.6,0,.9,.5)}
72%{transform:translate(var(--dx),0) rotateX(calc(var(--rx)*.93)) rotateZ(var(--rz));animation-timing-function:cubic-bezier(.2,.7,.4,1)}
86%{transform:translate(var(--dx),-15px) rotateX(calc(var(--rx)*.98)) rotateZ(var(--rz));animation-timing-function:cubic-bezier(.6,0,.9,.5)}
100%{transform:translate(var(--dx),0) rotateX(var(--rx)) rotateZ(var(--rz))}}
#res{min-height:38px;text-align:center;font:700 30px/1.3 var(--f2);letter-spacing:.04em;margin-top:6px}#res .g{color:var(--gold3);text-shadow:0 0 20px rgba(226,189,114,.65)}
.pop{display:inline-block;animation:pp .5s}@keyframes pp{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.sk{animation:sk .4s}@keyframes sk{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
#st{font:500 15px var(--f1);color:var(--gold3);margin:2px 0;text-align:center}
#q{text-align:center;min-height:30px}
button.chip{padding:5px 15px;border-radius:99px;font-size:14px}button.chip:disabled{opacity:1}
button.chip:not(.sel){color:var(--fg);background:linear-gradient(180deg,#3d5481,#2d4168);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #16203a}
.chip{margin-right:6px}
#bt{flex:1 0 100%;padding:15px;font-size:18px}
#nw,#rr{flex:1}
#lg{font-size:12.5px;color:var(--mute);min-height:62px}
#ov{position:fixed;inset:0;background:rgba(10,16,32,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov.on{display:flex}.box{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid rgba(226,189,114,.35);border-radius:22px;padding:20px;max-width:440px;width:100%;box-shadow:0 24px 50px rgba(8,14,28,.6),inset 0 1px 0 rgba(255,255,255,.09)}
.box b{font-family:var(--f2);color:var(--gold3)}
.box:has(.acs){max-width:900px;background:linear-gradient(165deg,rgba(38,55,90,.96),rgba(22,32,56,.97))}
.ahd{text-align:center;font:700 22px var(--f2);color:var(--gold3);letter-spacing:.04em}.asub{text-align:center;font-size:13px;opacity:.75;margin:2px 0 4px}
.acs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.ac{--c1:#c9d3e6;--c2:#7d8aa6;--gl:rgba(190,205,230,.35);position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0;padding:22px 16px 20px;min-height:290px;border-radius:16px;cursor:pointer;color:var(--fg);font:400 13.5px/1.55 var(--f1);letter-spacing:0;background:linear-gradient(180deg,#1b2540,#0f1626);border:2px solid var(--c2);box-shadow:0 0 0 3px #0a1020,0 0 0 4px var(--c2),0 0 26px var(--gl),inset 0 0 30px rgba(0,0,0,.5);transition:transform .18s,box-shadow .18s;animation:acin .5s both}
.ac:nth-child(2){animation-delay:.08s}.ac:nth-child(3){animation-delay:.16s}
@keyframes acin{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.ac:hover,.ac:focus-visible{transform:translateY(-8px) scale(1.03);box-shadow:0 0 0 3px #0a1020,0 0 0 4px var(--c1),0 0 46px var(--gl),inset 0 0 30px rgba(0,0,0,.4);outline:0}
.ac::before{content:"";position:absolute;inset:6px;border-radius:11px;border:1px solid var(--c2);opacity:.45;pointer-events:none}
.ac .em2{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:38px;line-height:1;color:var(--c1);margin:4px 0 6px;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(0,0,0,.35) 70%);border:2px solid var(--c2);box-shadow:0 0 22px var(--gl),inset 0 0 14px rgba(0,0,0,.6);text-shadow:0 0 14px var(--c1)}
.ac .nm{font:700 19px var(--f2);color:#fff}
.ac .tr{font-size:11px;letter-spacing:.14em;padding:2px 12px;border-radius:99px;border:1px solid var(--c2);color:var(--c1);background:rgba(0,0,0,.35)}
.ac .ds{opacity:.92;max-width:22ch}
.ac .pk{margin-top:auto;font-size:12px;letter-spacing:.2em;color:var(--c1);opacity:.0;transition:opacity .18s}.ac:hover .pk,.ac:focus-visible .pk{opacity:1}
.ac.희귀{--c1:#f7e6b8;--c2:#d9a93f;--gl:rgba(226,189,114,.5);background:linear-gradient(180deg,#2a2412,#120f08)}
.ac.전설{--c1:#f2dcff;--c2:#b98cff;--gl:rgba(185,140,255,.55);background:linear-gradient(180deg,#26163f,#0e0a1e);border-color:transparent;background-clip:padding-box;animation:acin .5s both,prism 5s linear infinite}
@keyframes prism{0%{box-shadow:0 0 0 3px #0a1020,0 0 0 4px #ff7fb0,0 0 28px rgba(255,127,176,.5),inset 0 0 30px rgba(0,0,0,.5)}33%{box-shadow:0 0 0 3px #0a1020,0 0 0 4px #7fd8ff,0 0 28px rgba(127,216,255,.5),inset 0 0 30px rgba(0,0,0,.5)}66%{box-shadow:0 0 0 3px #0a1020,0 0 0 4px #b6ff9a,0 0 28px rgba(182,255,154,.5),inset 0 0 30px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 3px #0a1020,0 0 0 4px #ff7fb0,0 0 28px rgba(255,127,176,.5),inset 0 0 30px rgba(0,0,0,.5)}}
.ac.전설 .nm{background:linear-gradient(90deg,#ffb3d1,#b3e6ff,#d4ffb3,#ffb3d1);-webkit-background-clip:text;background-clip:text;color:transparent}
.ag2.일반{border-color:#8d9ab6}.ag2.희귀{border-color:#d9a93f}.ag2.전설{border-color:#b98cff}
@media(max-width:700px){.acs{grid-template-columns:1fr;gap:12px}.ac{flex-direction:row;text-align:left;min-height:0;padding:14px;gap:14px;flex-wrap:wrap}.ac .em2{width:56px;height:56px;font-size:26px;margin:0}.ac .pk{display:none}.ac .ds{max-width:none;flex-basis:100%}}
@media(prefers-reduced-motion:reduce){.ac,.ac.전설{animation:none}}
.cards{display:grid;gap:10px;margin-top:14px}
.cd{text-align:left;font:400 13.5px/1.5 var(--f1);letter-spacing:0;color:var(--fg);background:linear-gradient(180deg,#36497270,#2a3b5c);background:linear-gradient(180deg,#38507b,#2b3e62);border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #16203a}
.cd b{display:block;font:700 16px var(--f2);color:var(--gold3);margin-bottom:2px}
.cd.희귀{border-color:rgba(100,170,240,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #16203a,0 0 18px rgba(79,151,234,.3)}
.cd.전설{border-color:rgba(226,189,114,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #16203a,0 0 20px rgba(226,189,114,.35)}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mapb{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 8px 12px;font:400 12px/1.4 var(--f1);letter-spacing:0;min-width:0}
.mapb svg{width:100%;max-width:120px;height:auto;display:block}.mapb b{font:700 14px var(--f2);color:var(--gold3)}.mapb span{opacity:.8}
.mapb:disabled{opacity:1;cursor:default}.mapb:disabled[aria-checked=false]{opacity:.4}
.mapb[aria-checked=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(226,189,114,.4)}
@media(max-width:560px){.maps{grid-template-columns:1fr}.mapb{flex-direction:row;text-align:left;gap:12px}.mapb svg{width:72px;flex:none}}
.ptm{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;margin:6px 0 2px}.ptm b{font:700 22px var(--f2);color:var(--gold3);min-width:1.4em;text-align:center}
.bar{display:block;width:120px;height:8px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3));transition:width .25s linear}
.pw{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:16px;font-size:13px}.pwr{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:10px;background:rgba(0,0,0,.2);opacity:.8}.pwr.ok{opacity:1}.pwr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pwr b{font-weight:700;color:var(--mute)}.pwr.ok b{color:var(--gold3)}
.asub.wt{margin:22px 0 4px;font-size:15px}
.pkc{fill:rgba(226,189,114,.14);stroke:var(--gold);stroke-width:3;cursor:pointer;animation:pkp 1s ease-in-out infinite}@keyframes pkp{50%{fill:rgba(226,189,114,.34)}}
#ab{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:0}#ab:empty{display:none}#abw{padding:10px 12px}
#tp{max-width:var(--bw);margin:12px auto 0;box-sizing:border-box;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}#tp .tl,#tp .tr{min-width:0}#tp .row{margin:8px 0 0}#tp .row button{flex:1 1 110px}#tp #res{min-height:34px;font-size:28px}
@media(max-width:600px){#tp{grid-template-columns:minmax(0,1fr)}}
.abtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 6px;font-size:14px;min-width:0;line-height:1.25}.abtn small{font-size:11px;opacity:.8;font-weight:400}
.ag2.off,.agt.off{opacity:.45;text-decoration:line-through}
.hero{text-align:center;padding:22px 0 2px}.hero h1{font-size:34px}
.logo{display:block;width:150px;height:auto;margin:0 auto 10px}
.lob{display:grid;gap:12px;margin-top:16px}.lob button{padding:14px;font-size:16px}
input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#18253f;color:var(--fg);width:100%;box-sizing:border-box;box-shadow:inset 0 2px 5px rgba(8,14,28,.5)}
label.f{display:block;font:700 13px var(--f1);color:var(--mute);margin-bottom:6px}

.ok{color:var(--gold3);font-weight:700}.wait{color:var(--mute)}

#nw,#rr{padding:13px 12px}#nw:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1.5px var(--gold),0 3px 0 #16203a,0 8px 14px rgba(8,14,28,.35)}

.orbs.sm{gap:7px;margin:9px 0 5px}

function tpGrant(i,x){const p=S.pc[i],k=AUG[x].k;const at=p.a.indexOf(x);
if(at>=0){p.a.splice(at,1);delete p.u[k];delete p.usedT[k];log(`[테스트] ${nmOf(i)}: ${AUG[x].n} 제거`)}
else{p.a.push(x);if(k!="last")applyAug(i,x);else log(`[테스트] ${AUG[x].n}: 선택 단계에서만 효과가 있어 부여만 합니다`)}ui();tpRender()}
$("#tpe").onclick=e=>{const b=e.target.closest("[data-e]");if(!b||!S.test)return;const v=b.dataset.e;if(v=="end")evClear();else if(v=="exec")evExec();else{if(S.ev)evClear();evBegin(v,S.rnd)}ui();tpRender()};
$("#tpf").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;S.force=+b.dataset.f;tpRender()};
$("#tpt").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;TT=+b.dataset.t;tpRender()};
$("#tpl").onclick=e=>{const b=e.target.closest("[data-a]");if(!b||!S.test)return;tpGrant(TT,+b.dataset.a)};
$("#tpx").onclick=()=>{$("#tdv").hidden=true;$("#tpo").hidden=false;document.body.classList.remove("tpon")};$("#tpo").onclick=()=>{$("#tpo").hidden=true;$("#tdv").hidden=false;document.body.classList.add("tpon");tpRender()};
const bTestEl=$("#bTest");if(bTestEl)bTestEl.onclick=()=>{nick();say("");setMap(0);enterGame(false,4,1);TT=0;$("#tdv").hidden=false;$("#tpo").hidden=true;document.body.classList.add("tpon");log("테스트 방: 오른쪽 패널에서 증강을 부여하고 윷 결과를 고정할 수 있어요");tpRender()};
$("#evtT").onclick=()=>{if(role!="host"||!R||R.started)return;R.evt=!R.evt;pub();renderRoom()};
$("#augT").onclick=()=>{if(role!="host"||!R||R.started)return;R.aug=!R.aug;pub();renderRoom()};
$("#rReady").onclick=()=>{if(role!="guest"||!R)return;const me=R.pl.find(p=>p.id==ID);if(!me)return;me.ready=!me.ready;send({t:"ready",id:ID,ready:me.ready});renderRoom()};
$("#rStart").onclick=()=>{if(role!="host"||!R||R.started||R.pl.length<2||!R.pl.every(p=>p.ready))return;R.started=true;setMap(R.map);pub();hostEnter()};
$("#rLeave").onclick=leaveRoom;
$("#bk").onclick=leaveRoom;
$("#rcopy").onclick=()=>{try{navigator.clipboard.writeText(R.code).then(()=>{$("#rcopy").textContent="복사됨";setTimeout(()=>{$("#rcopy").textContent="코드 복사"},1200)}).catch(()=>{})}catch(e){}};
addEventListener("pagehide",()=>{if(R)send(role=="host"?{t:"close"}:{t:"leave",id:ID})});

view("lobby");
</script></body></html>
